function queueAttendanceBackground(entry) {

async function sendLocalPendingItem(eventKey, item) {
  try {

      firestoreResult = await saveTabletAttendanceToFirestore(item);
      const firestoreStatus = String(firestoreResult && firestoreResult.status || "");
      if (["success", "duplicate", "already"].indexOf(firestoreStatus) === -1 && firestoreResult.duplicate !== true) {
        throw new Error("출결 저장을 완료하지 못했습니다.");
      }
      const pendingAfterFirestore = getLocalPendingStore();
      if (pendingAfterFirestore.items[eventKey]) {
        pendingAfterFirestore.items[eventKey].firestoreDone = true;
        pendingAfterFirestore.items[eventKey].firestoreResult = firestoreResult;
        pendingAfterFirestore.items[eventKey].serverEventId = firestoreResult.eventId || "";
        pendingAfterFirestore.items[eventKey].status = "firestore_saved";
        pendingAfterFirestore.items[eventKey].updatedAt = getNowIso();
        saveLocalPendingStore(pendingAfterFirestore);
        item = pendingAfterFirestore.items[eventKey];
      }
      const log = getLocalAttendanceStore();
      if (log.entries[eventKey]) {
        log.entries[eventKey].status = "firestore_saved";
        log.entries[eventKey].serverEventId = firestoreResult.eventId || "";
        log.entries[eventKey].updatedAt = getNowIso();
        saveLocalAttendanceStore(log);
      }
    }

    // 7.34.3.13: 알림톡은 Firestore 이벤트 생성 트리거가 서버에서 직접 처리합니다.
    // 태블릿 브라우저가 GAS 알림 호출까지 책임지면 화면 종료·네트워크 전환 시
    // 출결은 저장되고 알림만 누락될 수 있으므로, Firestore 저장 성공 시 로컬 작업을 종료합니다.
    updateLocalAttendanceEventStatus(eventKey, "success", {
      eventId: (firestoreResult && firestoreResult.eventId) || item.serverEventId || "",
      notificationState: (firestoreResult && firestoreResult.notificationState) || "pending"
    });
  } catch (err) {
    const pending = getLocalPendingStore();
    if (pending.items[eventKey]) {
      pending.items[eventKey].attempts = Number(pending.items[eventKey].attempts || 0) + 1;
      pending.items[eventKey].lastError = err && err.message ? err.message : String(err);
      pending.items[eventKey].updatedAt = getNowIso();
      saveLocalPendingStore(pending);
    }
  }
}

async function processLocalPendingAttendanceQueue() {
  if (pendingProcessing) return;
  pendingProcessing = true;
  try {
    const pending = getLocalPendingStore();
    const keys = Object.keys(pending.items || {});
    for (let i = 0; i < keys.length; i++) {
      const key = keys[i];
      const item = pending.items[key];
      if (!item || Number(item.attempts || 0) >= 10) continue;
      await sendLocalPendingItem(key, item);
      break;
    }
  } finally {

  }
}
